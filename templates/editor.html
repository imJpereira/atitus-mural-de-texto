<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ sala }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="editor" data-room="{{ sala }}">
    <header class="editor-cabecalho">
        <h1 class="editor-sala">{{ sala }}</h1>
        <p class="editor-rotulo">sala</p>
        <p id="status" class="editor-status" hidden>Reconectando...</p>
    </header>
    <main class="editor-painel">
        <textarea id="editor" class="editor-texto" placeholder="Comece a escrever..."></textarea>
        <div id="preview" class="editor-preview"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script src="/static/editor.js"></script>
</body>
</html>
