<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sala: {{ sala }}</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #333; color: white; padding: 10px 20px; }
        .container { display: flex; flex: 1; overflow: hidden; }
        textarea, #preview { flex: 1; padding: 20px; overflow-y: auto; font-size: 16px; }
        textarea { border: none; border-right: 1px solid #ccc; resize: none; outline: none; }
    </style>
</head>
<body>
    <header>
        <h2>Sala: {{ sala }}</h2>
    </header>
    <div class="container">
        <textarea id="editor" placeholder=" Digite aqui..."></textarea>
        <div id="preview">O preview aparecerá aqui.</div>
    </div>
</body>
</html>
